[project]
name = "ai-agent"
version = "0.1.0"
description = "AI agent - curso Build with AI"
readme = "notes.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "python-dotenv>=1.2.3",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
